name: Cron:Dependency-Report

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ github.token }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📊 Generate weekly dependency report
        id: report
        uses: grasdouble/Lufa-CICD/actions/dependency-report@dependency-report-v1
