name: SLM:Publish-to-Prod:Importmap
# Publish SLM Importmap to production via FTP.

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: 'MF_Importmap'
    permissions:
      contents: read
      deployments: write
      packages: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 Sync importmap versions
        shell: bash
        run: |
          pnpm slm:sync:importmaps

      - name: 📋 Prepare importmap for deployment
        shell: bash
        run: |
          mkdir -p /tmp/importmap-deploy
          cp packages/slm-container/public/importMap.json /tmp/importmap-deploy/

      - name: 📂 Deploy to FTP
        uses: grasdouble/Lufa-CICD/actions/ftp-deploy@ftp-deploy-v1
        with:
          server: ${{ secrets.CDN_FTP_URL }}
          port: ${{ secrets.CDN_FTP_PORT }}
          protocol: ${{ secrets.CDN_FTP_PROTOCOL }}
          username: ${{ secrets.CDN_FTP_LOGIN }}
          password: ${{ secrets.CDN_FTP_PWD }}
          local-dir: '/tmp/importmap-deploy/'
          exclude: |
            .well-known/**
            cgi-bin/**
            .ftpquota
            .htaccess
            index.html
