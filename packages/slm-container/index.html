<!doctype html>
<html lang="en" data-theme="lufa" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sebastien-lemouillour.fr</title>
    <link
      rel="stylesheet"
      href="https://cdn.sebastien-lemouillour.fr/@grasdouble/lufa_design-system@%LUFA_DS_VERSION%/style.css"
    />
  </head>
  <body>
    <import-map-overrides-full show-when-local-storage="devtools"></import-map-overrides-full>
    <div id="lufa-header"></div>
    <div id="lufa-loader" aria-hidden="true">
      <div id="lufa-loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div id="lufa-container"></div>
    <style>
      #lufa-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        top: 60px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #lufa-loader.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #lufa-loader-dots {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #lufa-loader-dots span {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: var(--lufa-core-color-brand-primary-default);
        animation: lufa-pulse 1.2s ease-in-out infinite;
      }
      #lufa-loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      #lufa-loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes lufa-pulse {
        0%,
        80%,
        100% {
          transform: scale(0.5);
          opacity: 0.3;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
    <script type="module">
      const isLocalMapMode = import.meta.env.DEV || import.meta.env.MODE === 'preview';

      if (isLocalMapMode) {
        localStorage.setItem('devtools', 'true');
        import('/src/main.js').catch((err) => {
          console.error('Failed to load main.js in local import-map mode:', err);
        });
      } else {
        fetch('https://cdn.sebastien-lemouillour.fr/importMap.json')
          .then((res) => res.json())
          .then((importMap) => {
            const script = document.createElement('script');
            script.type = 'overridable-importmap';
            script.textContent = JSON.stringify(importMap, null, 2);
            document.head.appendChild(script);
          })
          .then(() => import('/src/main.js'))
          .catch((err) => {
            console.error('Failed to load import map or main.js:', err);
          });
      }
    </script>
  </body>
</html>
