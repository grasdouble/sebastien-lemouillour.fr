<!doctype html>
<html lang="en" data-theme="lufa" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sebastien-lemouillour.fr</title>
    <!-- Preconnect to external origins used by design system and parcels -->
    <link rel="preconnect" href="https://cdn.sebastien-lemouillour.fr" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.sebastien-lemouillour.fr" />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="dns-prefetch" href="https://esm.sh" />
    <meta
      name="description"
      content="Portfolio de Sébastien Lemouillour — expériences, tutoriels techniques sur l'IA, le tooling et l'architecture front-end."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sebastien-lemouillour.fr" />
    <meta property="og:title" content="sebastien-lemouillour.fr" />
    <meta
      property="og:description"
      content="Portfolio de Sébastien Lemouillour — expériences, tutoriels techniques sur l'IA, le tooling et l'architecture front-end."
    />
    <meta property="og:url" content="https://sebastien-lemouillour.fr" />
    <!-- Load design system CSS asynchronously to eliminate render-blocking (410ms saving) -->
    <link
      rel="preload"
      href="https://cdn.sebastien-lemouillour.fr/@grasdouble/lufa_design-system@%LUFA_DS_VERSION%/style.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
  </head>
  <body>
    <import-map-overrides-full show-when-local-storage="devtools"></import-map-overrides-full>
    <div id="lufa-header"></div>
    <div id="lufa-loader" aria-hidden="true">
      <div class="lufa-loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div id="lufa-container"></div>
    <script type="module">
      const isLocalMapMode = import.meta.env.DEV || import.meta.env.MODE === 'preview';

      if (isLocalMapMode) {
        localStorage.setItem('devtools', 'true');
        import('/src/main.js').catch((err) => {
          console.error('Failed to load main.js in local import-map mode:', err);
        });
      } else {
        fetch('https://cdn.sebastien-lemouillour.fr/importMap.json', { cache: 'no-cache' })
          .then((res) => res.json())
          .then((importMap) => {
            const script = document.createElement('script');
            script.type = 'overridable-importmap';
            script.textContent = JSON.stringify(importMap, null, 2);
            document.head.appendChild(script);
          })
          .then(() => import('/src/main.js'))
          .catch((err) => {
            console.error('Failed to load import map or main.js:', err);
          });
      }
    </script>
  </body>
</html>
