<!doctype html>
<html lang="en" data-theme="lufa" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sebastien-lemouillour.fr</title>
    <!-- Preconnect to external origins used by design system and parcels -->
    <link rel="preconnect" href="https://cdn.sebastien-lemouillour.fr" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.sebastien-lemouillour.fr" />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="dns-prefetch" href="https://esm.sh" />
    <meta
      name="description"
      content="Portfolio de Sébastien Lemouillour — expériences, tutoriels techniques sur l'IA, le tooling et l'architecture front-end."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sebastien-lemouillour.fr" />
    <meta property="og:title" content="sebastien-lemouillour.fr" />
    <meta
      property="og:description"
      content="Portfolio de Sébastien Lemouillour — expériences, tutoriels techniques sur l'IA, le tooling et l'architecture front-end."
    />
    <meta property="og:url" content="https://sebastien-lemouillour.fr" />
    <!-- Load design system CSS asynchronously to eliminate render-blocking (410ms saving) -->
    <link
      rel="preload"
      href="https://cdn.sebastien-lemouillour.fr/@grasdouble/lufa_design-system@%LUFA_DS_VERSION%/style.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
  </head>
  <body>
    <import-map-overrides-full show-when-local-storage="devtools"></import-map-overrides-full>
    <div id="lufa-header"></div>
    <div id="lufa-loader" aria-hidden="true">
      <div class="lufa-loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div id="lufa-container"></div>
    <script type="module">
      const isDev = import.meta.env.DEV;
      const isPreview = import.meta.env.MODE === 'preview';
      const isProd = !isDev && !isPreview;

      async function loadJson(path) {
        const res = await fetch(path, { cache: 'no-cache' });
        return res.json();
      }

      function deepMerge(base, overrides) {
        const result = { ...base };
        if (overrides.imports) {
          result.imports = { ...result.imports, ...overrides.imports };
        }
        return result;
      }

      async function injectImportMap() {
        let baseMapPath = '/importMap.json';
        if (isProd) {
          baseMapPath = 'https://cdn.sebastien-lemouillour.fr/importMap.json';
        }

        const baseMap = await loadJson(baseMapPath);
        let finalMap = baseMap;

        if (isDev) {
          const devOverrides = await loadJson('/importMap.overrides.dev.json');
          finalMap = deepMerge(baseMap, devOverrides);
        } else if (isPreview) {
          const previewOverrides = await loadJson('/importMap.overrides.preview.json');
          finalMap = deepMerge(baseMap, previewOverrides);
        }

        const script = document.createElement('script');
        script.type = 'importmap';
        script.textContent = JSON.stringify(finalMap, null, 2);
        document.head.insertBefore(script, document.head.firstChild);
      }

      async function initialize() {
        localStorage.setItem('devtools', 'true');

        await injectImportMap();
        return import('/src/main.js');
      }

      initialize().catch((err) => {
        console.error('Failed to initialize application:', err);
      });
    </script>
  </body>
</html>
