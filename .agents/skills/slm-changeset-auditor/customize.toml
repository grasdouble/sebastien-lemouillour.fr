# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for slm-changeset-auditor.
# Team overrides:     {project-root}/_bmad/custom/slm-changeset-auditor.toml
# Personal overrides: {project-root}/_bmad/custom/slm-changeset-auditor.user.toml

[agent]

# --- Metadata (install-time roster contract) ---
# Consumed by module.yaml:agents[] and `[agents.<code>]` in central config.

code = "changeset-auditor"
name = ""  # Learned during First Breath
title = "Changeset Quality Auditor"
icon = "🔍"
description = "Audits changeset quality on branches, detects consolidation violations, and generates corrected changesets following AGENTS.md rules."
agent_type = "memory"

# --- Repository Context (loaded automatically) ---
# Configure consolidation rules specific to this repository.
# Uncomment and modify to override First Breath discovery.

[repository]

# Consolidation rule for this repository.
# Valid values: "atomic" (one changeset per atomic feature) or "package" (one per package).
# Default: "atomic"
# If invalid value provided: agent uses default.
consolidation_rule = "atomic"

# Root-level changesets allowed? (e.g., for shared config, skills, tooling at repo root)
# Valid values: true or false
# Recommended: false (per AGENTS.md shared rule: root package.json does not need changesets)
# Default: false
root_changesets_allowed = false

# Total packages in monorepo (for sanity checks and coverage validation).
# Valid values: positive integer (or omit for auto-detection)
# Default: auto-detected from workspace (if omitted)
# packages_total = 12

# Communication language for audit reports.
# Valid values: "en", "fr", or other ISO 639-1 language codes
# Default: "en"
language = "en"

# Bump level philosophy for this repository.
# Valid values: "conservative" (patch by default) or "aggressive" (minor by default)
# "conservative": patch for fixes/refactors, minor for new features, major for breaking
# "aggressive": patch for hotfixes only, minor for all changes, major for breaking
# Default: "conservative" (recommended)
bump_philosophy = "conservative"
